[workspace]
resolver = "2"
members = [
    "crates/girsa-source",
    "crates/girsa-hebrew",
    "crates/girsa-ref",
    "crates/girsa-cite",
    "crates/girsa-alive",
    "crates/girsa-post",
    "crates/girsa-ksav",
]

# Every crate here is compiled into BOTH Girsa and Ksav. The version is shared
# and bumped as one unit: a consumer pins an exact version (`=0.5.6`), so a
# mismatched pair is a resolution error rather than a runtime surprise.
[workspace.package]
version = "0.5.6"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/SYKhayyat/sefer-crates"
authors = ["Shaul Khayyat"]

[workspace.dependencies]
girsa-hebrew = { version = "=0.5.6", path = "crates/girsa-hebrew" }
girsa-ref = { version = "=0.5.6", path = "crates/girsa-ref" }
girsa-source = { version = "=0.5.6", path = "crates/girsa-source" }
girsa-cite = { version = "=0.5.6", path = "crates/girsa-cite" }
girsa-alive = { version = "=0.5.6", path = "crates/girsa-alive" }
girsa-post = { version = "=0.5.6", path = "crates/girsa-post" }
girsa-ksav = { version = "=0.5.6", path = "crates/girsa-ksav" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[workspace.lints.rust]
# Forbidden, not merely denied — and `girsa-alive` is the one crate that does
# not take this table. It exists so that *is this process alive* has somewhere
# to live: the question has no safe spelling, and the alternative was a `pid`
# field documented as a check nobody had written. Every `unsafe` block in this
# workspace is in that crate's `lib.rs`.
unsafe_code = "forbid"

[workspace.lints.clippy]
# A wrong ref is worse than no ref (BUILDER rule 6). Panicking in a resolver is
# a worse outcome than returning Ambiguous, so the panicking paths are denied
# in library code and allowed only in tests.
unwrap_used = "deny"
expect_used = "deny"
